<html>
  <body>
    <script type="module">
      import { expect } from "@open-wc/testing";
      import { runTests } from "@web/test-runner-mocha";
      import {
        FLYOUT_V2_QUERY_PARAM,
        FLYOUT_V2_STORAGE_KEY,
        isFlyoutV2Enabled,
        persistFlyoutV2OptIn,
      } from "../src/utils";

      const setParam = (value) => {
        const url = new URL(window.location.href);
        if (value === null) {
          url.searchParams.delete(FLYOUT_V2_QUERY_PARAM);
        } else {
          url.searchParams.set(FLYOUT_V2_QUERY_PARAM, value);
        }
        window.history.replaceState({}, "", url);
      };

      runTests(() => {
        // Test files share one origin, so a leftover opt-in would switch
        // v1 addons off in whichever file runs next.
        const reset = () => {
          window.localStorage.removeItem(FLYOUT_V2_STORAGE_KEY);
          setParam(null);
        };
        beforeEach(reset);
        afterEach(reset);

        describe("Flyout v2 opt-in", () => {
          it("is off by default", () => {
            expect(isFlyoutV2Enabled()).to.be.false;
          });

          it("turns on with the query param and sticks across navigation", () => {
            setParam("true");
            expect(isFlyoutV2Enabled()).to.be.true;

            persistFlyoutV2OptIn();
            setParam(null);
            expect(isFlyoutV2Enabled()).to.be.true;
          });

          it("turns off with the query param and forgets the opt-in", () => {
            window.localStorage.setItem(FLYOUT_V2_STORAGE_KEY, "true");
            setParam("false");
            expect(isFlyoutV2Enabled()).to.be.false;

            persistFlyoutV2OptIn();
            setParam(null);
            expect(isFlyoutV2Enabled()).to.be.false;
          });

          it("ignores other values without touching storage", () => {
            window.localStorage.setItem(FLYOUT_V2_STORAGE_KEY, "true");
            setParam("maybe");
            persistFlyoutV2OptIn();
            expect(window.localStorage.getItem(FLYOUT_V2_STORAGE_KEY)).to.equal(
              "true",
            );
          });
        });
      });
    </script>
  </body>
</html>
